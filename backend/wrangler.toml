name = "whyshield-backend"
main = "src/index.ts"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# 24h verdict cache, keyed by sha256(normalizedUrl).
#
# The `id` below is a fake-but-format-valid placeholder. In local dev
# (`wrangler dev`, which is local by default in wrangler 3+), Miniflare
# provides an in-memory KV simulator and ignores the id entirely — the
# binding works as long as the block is present.
#
# Before deploying to Cloudflare for real:
#   1. Run `wrangler kv namespace create VERDICT_CACHE`
#   2. Replace the placeholder id below with the returned id
#   3. `wrangler deploy`
[[kv_namespaces]]
binding = "VERDICT_CACHE"
id = "0000000000000000000000000000abcd"
